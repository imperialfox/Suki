name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # the suite in Chrome's engine and in Safari's (Q32), side by side; one failing doesn't stop the other
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit]  # Q32 PROBE
    name: test (${{ matrix.browser }})
    runs-on: ubuntu-24.04  # pinned: Playwright 1.56 supports this image
    timeout-minutes: 25
    env:
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Playwright and ${{ matrix.browser }}
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Run the test suite
        run: python tests/run.py --browser ${{ matrix.browser }} probe history  # Q32 PROBE

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.browser }}
          path: tests/output
          retention-days: 14
