<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173874"/>
      <stop offset="1" stop-color="#06102b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="45%">
      <stop offset="0" stop-color="#4b84ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#4b84ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>
  <text x="512" y="744" text-anchor="middle" fill="#fafcff" filter="url(#shadow)"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="670" font-weight="900">S</text>
</svg>